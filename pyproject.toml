[project]
name = "sahana-sridhar-fintechpayments"
version = "0.1.1"
description = "A Python CLI for retrieving Stripe account balance"
readme = "README.md"
authors = [
    { name = "sahu0429", email = "sahanasridhar294@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
]
[project.scripts]
stripe-balance = "sahana_sridhar_fintech.cli:main"
[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
[tool.uv.build-backend]
module-name = "sahana_sridhar_fintech"
module-root = "src"